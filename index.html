<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Thi Trắc nghiệm Trực tuyến</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: var(--bg-white);
            width: 100%;
            max-width: 420px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .role-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .role-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: var(--bg-gray);
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .role-tab.active {
            background: var(--bg-white);
            color: var(--primary-blue);
            border-bottom: 3px solid var(--primary-blue);
        }
        .login-body {
            padding: 2rem;
        }
        .login-title {
            text-align: center;
            color: var(--primary-blue);
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--primary-blue);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-full {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">HỆ THỐNG THI TRẮC NGHIỆM TRỰC TUYẾN</div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Chuyển đổi vai trò theo Wireframe -->
            <div class="role-tabs">
                <button class="role-tab active" onclick="switchRole('student', this)">Dành cho Thí sinh</button>
                <button class="role-tab" onclick="switchRole('teacher', this)">Dành cho Giảng viên</button>
            </div>

            <div class="login-body">
                <h2 class="login-title" id="form-title">ĐĂNG NHẬP THÍ SINH</h2>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username" id="username-label">Tên đăng nhập / MSSV:</label>
                        <input type="text" id="username" placeholder="Nhập mã sinh viên..." required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu:</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
                    </div>
                    <a href="#" class="forgot-link" onclick="alert('Vui lòng liên hệ Giám thị hoặc Phòng Đào tạo để cấp lại mật khẩu!')">Quên mật khẩu?</a>
                    <button type="submit" class="btn btn-primary btn-full">ĐĂNG NHẬP</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'student';

        function switchRole(role, element) {
            currentRole = role;
            // Đổi màu tab
            document.querySelectorAll('.role-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            // Đổi tiêu đề và placeholder tương ứng
            if (role === 'student') {
                document.getElementById('form-title').innerText = 'ĐĂNG NHẬP THÍ SINH';
                document.getElementById('username-label').innerText = 'Tên đăng nhập / MSSV:';
                document.getElementById('username').placeholder = 'Nhập mã sinh viên...';
            } else {
                document.getElementById('form-title').innerText = 'ĐĂNG NHẬP GIẢNG VIÊN';
                document.getElementById('username-label').innerText = 'Tên đăng nhập / Mã GV:';
                document.getElementById('username').placeholder = 'Nhập tài khoản giảng viên...';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            // Tạm thời chuyển trang trực tiếp để test giao diện (Sau này Trà làm API sẽ gắn fetch ở đây)
            if (currentRole === 'student') {
                window.location.href = 'student-home.html';
            } else {
                window.location.href = 'teacher-dashboard.html';
            }
        }
    </script>
</body>
</html>
